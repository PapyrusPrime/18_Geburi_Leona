<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>18. Geburtstag – Einladung</title>
  <style>
    :root {
      --bg: #14100a;
      --bg-panel: #1d1710;
      --amber: #ffb000;
      --amber-dim: #a86e00;
      --cream: #f4ead9;
      --red: #ff5c5c;
      --pink: #ff6fae;
      --teal: #3ddad7;
      --purple: #b48cff;
      --yellow: #ffe066;
      --mono: ui-monospace, "SFMono-Regular", "Courier New", Consolas, monospace;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      margin: 0;
    }

    body {
      background: var(--bg);
      color: var(--cream);
      font-family: var(--mono);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: repeating-linear-gradient(to bottom,
          rgba(255, 255, 255, 0.025) 0px,
          rgba(255, 255, 255, 0.025) 1px,
          transparent 1px,
          transparent 3px);
    }

    .screen {
      display: none;
      width: 100%;
      max-width: 560px;
    }

    .screen.active {
      display: block;
      animation: fadeIn .5s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .terminal-wrap {
      position: relative;
    }

    .terminal {
      background: var(--bg-panel);
      border: 1px solid var(--amber-dim);
      border-radius: 6px;
      box-shadow: 0 0 40px rgba(255, 176, 0, 0.08);
      overflow: hidden;
    }

    .terminal-bar {
      background: #241b10;
      padding: 8px 14px;
      font-size: 12px;
      color: var(--amber-dim);
      border-bottom: 1px solid var(--amber-dim);
    }

    .terminal-body {
      padding: 28px 26px 32px;
    }

    .line {
      color: var(--amber-dim);
      font-size: 13px;
      margin: 0 0 6px;
    }

    h1 {
      font-size: clamp(22px, 5vw, 30px);
      line-height: 1.3;
      margin: 14px 0 6px;
      color: var(--amber);
      font-weight: 600;
    }

    .subline {
      color: var(--cream);
      opacity: .85;
      margin: 0 0 26px;
      font-size: 15px;
    }

    .button-row {
      position: relative;
      display: flex;
      gap: 16px;
      align-items: center;
      min-height: 90px;
      flex-wrap: wrap;
    }

    button {
      font-family: var(--mono);
      font-size: 16px;
      padding: 12px 20px;
      border-radius: 4px;
      border: 1px solid currentColor;
      background: transparent;
      cursor: pointer;
      transition: transform .18s ease, opacity .18s ease;
    }

    button:focus-visible {
      outline: 2px solid var(--cream);
      outline-offset: 3px;
    }

    #btn-yes {
      color: var(--amber);
    }

    #btn-yes:hover {
      background: rgba(255, 176, 0, 0.08);
    }

    #btn-no {
      color: var(--red);
    }

    #btn-no:hover {
      background: rgba(255, 92, 92, 0.08);
    }

    #btn-no.roaming {
      position: fixed;
      z-index: 5;
    }

    .reaction {
      min-height: 20px;
      margin-top: 18px;
      font-size: 13px;
      color: var(--amber-dim);
    }

    .sticker {
      position: absolute;
      font-size: 34px;
      pointer-events: none;
      filter: drop-shadow(0 3px 6px rgba(0, 0, 0, .4));
      z-index: 2;
    }

    .sticker.s1 {
      top: -18px;
      left: -14px;
      transform: rotate(-18deg);
    }

    .sticker.s2 {
      top: -20px;
      right: -10px;
      transform: rotate(14deg);
    }

    .sticker.s3 {
      bottom: -18px;
      left: -16px;
      transform: rotate(10deg);
    }

    .sticker.s4 {
      bottom: -16px;
      right: -14px;
      transform: rotate(-12deg);
    }

    .detail-row {
      margin: 0 0 16px;
      padding: 10px 14px;
      border-left: 3px solid var(--accent, var(--amber));
      background: rgba(255, 255, 255, 0.03);
      border-radius: 0 6px 6px 0;
    }

    .detail-row:nth-of-type(1) {
      --accent: var(--pink);
    }

    .detail-row:nth-of-type(2) {
      --accent: var(--teal);
    }

    .detail-row:nth-of-type(3) {
      --accent: var(--purple);
    }

    .detail-row:nth-of-type(4) {
      --accent: var(--yellow);
    }

    .detail-row:nth-of-type(5) {
      --accent: var(--pink);
    }

    .detail-label {
      color: var(--accent, var(--amber-dim));
      font-size: 12px;
      margin: 0 0 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .detail-value {
      color: var(--cream);
      font-size: 15px;
      margin: 0;
      line-height: 1.5;
    }

    .greeting {
      color: var(--amber);
      font-size: 17px;
      margin: 0 0 20px;
    }

    hr {
      border: none;
      border-top: 1px solid var(--amber-dim);
      opacity: .4;
      margin: 22px 0;
    }

    /* ---- Countdown ---- */
    .countdown {
      text-align: center;
      margin: 24px 0 4px;
    }

    .countdown-label {
      color: var(--amber-dim);
      font-size: 12px;
      margin: 0 0 10px;
    }

    .countdown-boxes {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .cd-box {
      border: 1px solid var(--amber-dim);
      border-radius: 6px;
      background: rgba(255, 176, 0, 0.05);
      padding: 8px 6px;
      min-width: 64px;
    }

    .cd-num {
      display: block;
      font-size: 26px;
      color: var(--amber);
      font-weight: 600;
    }

    .cd-unit {
      display: block;
      font-size: 11px;
      color: var(--cream);
      opacity: .7;
    }

    .countdown-done {
      display: none;
      font-size: clamp(24px, 6vw, 34px);
      color: var(--amber);
      font-weight: 700;
      margin: 6px 0;
    }

    .countdown.finished .countdown-boxes,
    .countdown.finished .countdown-label {
      display: none;
    }

    .countdown.finished .countdown-done {
      display: block;
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>

<body>

  <main>
    <section id="screen-rsvp" class="screen active">
      <div class="terminal">
        <div class="terminal-bar">geburtstag.exe</div>
        <div class="terminal-body">
          <p class="line">&gt; Iladig wird glade ...</p>
          <h1 id="rsvp-title"></h1>
          <p class="subline">Chunsch du a mini Geburifier?</p>
          <div class="button-row">
            <button id="btn-yes">Jupp, sowas vo! 🎉</button>
            <button id="btn-no">Nope 😢</button>
          </div>
          <p class="reaction" id="reaction-text"></p>
        </div>
      </div>
    </section>

    <section id="screen-details" class="screen">
      <div class="terminal-wrap">
        <span class="sticker s1">🎉</span>
        <span class="sticker s2">🎈</span>
        <span class="sticker s3">✨</span>
        <span class="sticker s4">🎂</span>
        <div class="terminal">
          <div class="terminal-bar">details.exe</div>
          <div class="terminal-body">
            <p class="line">&gt; Zugriff gewährt. Lade Details ...</p>
            <p class="greeting" id="greeting"></p>

            <p class="detail-value" id="detail-intro"></p>
            <hr>

            <div class="detail-row">
              <p class="detail-label"> Wann</p>
              <p class="detail-value" id="detail-when"></p>
            </div>
            <div class="detail-row">
              <p class="detail-label"> Wo</p>
              <p class="detail-value" id="detail-where"></p>
            </div>
            <div class="detail-row">
              <p class="detail-label"> Motto</p>
              <p class="detail-value" id="detail-costume"></p>
            </div>
            <div class="detail-row">
              <p class="detail-label"> Was di erwartet</p>
              <p class="detail-value" id="detail-teaser"></p>
            </div>
            <div class="detail-row">
              <p class="detail-label"> Mitbringä</p>
              <p class="detail-value" id="detail-bring"></p>
            </div>

            <div class="countdown" id="countdown">
              <p class="countdown-label"> No bis zur Fier</p>
              <div class="countdown-boxes">
                <div class="cd-box"><span class="cd-num" id="cd-days">00</span><span class="cd-unit">Tage</span></div>
                <div class="cd-box"><span class="cd-num" id="cd-hours">00</span><span class="cd-unit">Std</span></div>
                <div class="cd-box"><span class="cd-num" id="cd-mins">00</span><span class="cd-unit">Min</span></div>
                <div class="cd-box"><span class="cd-num" id="cd-secs">00</span><span class="cd-unit">Sek</span></div>
              </div>
              <p class="countdown-done">🎉 LET'S GOOO! 🎉</p>
            </div>

            <hr>
            <p class="detail-value" id="detail-contact"></p>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script>
    const CONFIG = {
      name: "Leonaa",
      personalGreeting: "",
      intro: "Heyy I wör di gern zu mim Geburi ilade!",
      when: "Samstig, 24. Oktober 2026 ab 16:00 Uhr (Open End)",
      where: "Wilerstrasse 3 9200 Gossau SG",
      costume: "Bad Taste, legs schrägste us dim Schrank ah! Mues ned extrem sie, Hauptsach es isch schräg und lustig ;)",
      teaser: "Spieli, Chueche und gueti Lune, de Rest isch e Überraschig 😉",
      bring: "Gueti Lune (Pflicht 😉) und falls vorhande: cooli Gruppenspieli für ~10 Persone",
      contact: "Freu mi uf di 🎉",
      // Jahr, Monat (0 = Januar, 9 = Oktober), Tag, Stunde, Minute, Sekunde
      partyDate: new Date(2026, 9, 24, 16, 0, 0),
    };

    document.getElementById("rsvp-title").textContent = CONFIG.name + " wird 18i! 🎂";

    document.getElementById("greeting").textContent =
      CONFIG.personalGreeting || ("Schö dass du chunsch, " + "!");
    if (!CONFIG.personalGreeting) {
      document.getElementById("greeting").style.display = "none";
    }
    document.getElementById("detail-intro").textContent = CONFIG.intro;
    document.getElementById("detail-when").textContent = CONFIG.when;
    document.getElementById("detail-where").textContent = CONFIG.where;
    document.getElementById("detail-costume").textContent = CONFIG.costume;
    document.getElementById("detail-teaser").textContent = CONFIG.teaser;
    document.getElementById("detail-bring").textContent = CONFIG.bring;
    document.getElementById("detail-contact").textContent = CONFIG.contact;

    // --- Countdown ---
    const countdownEl = document.getElementById("countdown");
    const pad = (n) => String(n).padStart(2, "0");

    function updateCountdown() {
      const diff = CONFIG.partyDate - new Date();
      if (diff <= 0) {
        countdownEl.classList.add("finished");
        clearInterval(countdownTimer);
        return;
      }
      document.getElementById("cd-days").textContent = pad(Math.floor(diff / 86400000));
      document.getElementById("cd-hours").textContent = pad(Math.floor(diff / 3600000) % 24);
      document.getElementById("cd-mins").textContent = pad(Math.floor(diff / 60000) % 60);
      document.getElementById("cd-secs").textContent = pad(Math.floor(diff / 1000) % 60);
    }
    const countdownTimer = setInterval(updateCountdown, 1000);
    updateCountdown();

    // --- Ja/Nein Logik ---
    const btnYes = document.getElementById("btn-yes");
    const btnNo = document.getElementById("btn-no");
    const reaction = document.getElementById("reaction-text");
    const screenRsvp = document.getElementById("screen-rsvp");
    const screenDetails = document.getElementById("screen-details");

    const yesTexts = [
      "Jeyy! 🎉",
      "Jupppiii? 😄",
      "Freu mii...",
      "Fast am Ziel!",
      "Los goht's! 🚀"
    ];
    const noTexts = [
      "Bisch der sicher?",
      "Wirklich wirklich sicher?",
      "Schaddd... 🥺",
      "Okii i verstohh...",
      "okidoki .... 🙈"
    ];

    let yesClicks = 0;
    let noClicks = 0;

    btnYes.addEventListener("click", () => {
      yesClicks++;
      const scale = 1 + yesClicks * 0.35;
      btnYes.style.transform = `scale(${scale})`;
      reaction.textContent = yesTexts[Math.min(yesClicks - 1, yesTexts.length - 1)];
      if (yesClicks >= 5) {
        setTimeout(goToDetails, 400);
      }
    });

    btnNo.addEventListener("click", () => {
      noClicks++;
      const scale = Math.max(0.15, 1 - noClicks * 0.15);
      btnNo.classList.add("roaming");
      btnNo.style.transform = `scale(${scale})`;

      const maxX = window.innerWidth - 120;
      const maxY = window.innerHeight - 60;
      btnNo.style.left = Math.max(10, Math.random() * maxX) + "px";
      btnNo.style.top = Math.max(10, Math.random() * maxY) + "px";

      reaction.textContent = noTexts[Math.min(noClicks - 1, noTexts.length - 1)];
    });

    function goToDetails() {
      screenRsvp.classList.remove("active");
      screenDetails.classList.add("active");
    }
  </script>

</body>

</html>
