<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>18. Geburtstag – Einladung</title>
<style>
  /* ===================== DESIGN TOKENS ===================== */
  :root{
    --bg: #14100a;
    --bg-panel: #1d1710;
    --amber: #ffb000;
    --amber-dim: #a86e00;
    --cream: #f4ead9;
    --red: #ff5c5c;
    --mono: ui-monospace, "SFMono-Regular", "Courier New", Consolas, monospace;
  }
  *{ box-sizing: border-box; }
  html,body{ height:100%; margin:0; }
  body{
    background: var(--bg);
    color: var(--cream);
    font-family: var(--mono);
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 24px;
    overflow-x:hidden;
  }
  /* subtle CRT scanline texture */
  body::before{
    content:"";
    position:fixed; inset:0;
    pointer-events:none;
    background: repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,0.025) 0px,
      rgba(255,255,255,0.025) 1px,
      transparent 1px,
      transparent 3px
    );
  }

  .screen{ display:none; width:100%; max-width: 560px; }
  .screen.active{ display:block; animation: fadeIn .5s ease; }

  @keyframes fadeIn{
    from{ opacity:0; transform: translateY(8px); }
    to{ opacity:1; transform: translateY(0); }
  }

  .terminal{
    background: var(--bg-panel);
    border: 1px solid var(--amber-dim);
    border-radius: 6px;
    box-shadow: 0 0 40px rgba(255,176,0,0.08);
    overflow:hidden;
  }
  .terminal-bar{
    background: #241b10;
    padding: 8px 14px;
    font-size: 12px;
    color: var(--amber-dim);
    border-bottom: 1px solid var(--amber-dim);
  }
  .terminal-body{ padding: 28px 26px 32px; }

  .line{ color: var(--amber-dim); font-size: 13px; margin: 0 0 6px; }
  h1{
    font-size: clamp(22px, 5vw, 30px);
    line-height: 1.3;
    margin: 14px 0 6px;
    color: var(--amber);
    font-weight: 600;
  }
  .subline{ color: var(--cream); opacity:.85; margin: 0 0 26px; font-size: 15px; }

  .button-row{
    position: relative;
    display:flex;
    gap: 16px;
    align-items:center;
    min-height: 90px;
    flex-wrap: wrap;
  }
  button{
    font-family: var(--mono);
    font-size: 16px;
    padding: 12px 20px;
    border-radius: 4px;
    border: 1px solid currentColor;
    background: transparent;
    cursor: pointer;
    transition: transform .18s ease, opacity .18s ease;
  }
  button:focus-visible{ outline: 2px solid var(--cream); outline-offset: 3px; }

  #btn-yes{ color: var(--amber); }
  #btn-yes:hover{ background: rgba(255,176,0,0.08); }
  #btn-no{ color: var(--red); }
  #btn-no:hover{ background: rgba(255,92,92,0.08); }
  #btn-no.roaming{ position: fixed; z-index: 5; }

  .reaction{
    min-height: 20px;
    margin-top: 18px;
    font-size: 13px;
    color: var(--amber-dim);
  }

  /* ---- Detail screen ---- */
  .detail-row{ margin: 0 0 18px; }
  .detail-label{ color: var(--amber-dim); font-size: 12px; margin: 0 0 4px; }
  .detail-value{ color: var(--cream); font-size: 15px; margin:0; line-height:1.5; }
  .greeting{ color: var(--amber); font-size: 17px; margin: 0 0 20px; }
  hr{ border: none; border-top: 1px solid var(--amber-dim); opacity:.4; margin: 22px 0; }

  @media (prefers-reduced-motion: reduce){
    *{ animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<main>
  <!-- SCREEN 1: RSVP -->
  <section id="screen-rsvp" class="screen active">
    <div class="terminal">
      <div class="terminal-bar">geburtstag.exe</div>
      <div class="terminal-body">
        <p class="line">&gt; Einladung wird geladen ...</p>
        <h1 id="rsvp-title"></h1>
        <p class="subline">Kommst du an meine Geburtstagsfeier?</p>
        <div class="button-row">
          <button id="btn-yes">Ja, klar! 🎉</button>
          <button id="btn-no">Nein 😢</button>
        </div>
        <p class="reaction" id="reaction-text"></p>
      </div>
    </div>
  </section>

  <!-- SCREEN 2: DETAILS -->
  <section id="screen-details" class="screen">
    <div class="terminal">
      <div class="terminal-bar">details.exe</div>
      <div class="terminal-body">
        <p class="line">&gt; Zugriff gewährt. Lade Details ...</p>
        <p class="greeting" id="greeting"></p>

        <div class="detail-row">
          <p class="detail-label">Wann</p>
          <p class="detail-value" id="detail-when"></p>
        </div>
        <div class="detail-row">
          <p class="detail-label">Wo</p>
          <p class="detail-value" id="detail-where"></p>
        </div>
        <div class="detail-row">
          <p class="detail-label">Motto</p>
          <p class="detail-value" id="detail-costume"></p>
        </div>
        <div class="detail-row">
          <p class="detail-label">Was dich erwartet</p>
          <p class="detail-value" id="detail-teaser"></p>
        </div>
        <div class="detail-row">
          <p class="detail-label">Mitbringen</p>
          <p class="detail-value" id="detail-bring"></p>
        </div>
        <div class="detail-row">
          <p class="detail-label">Essen</p>
          <p class="detail-value" id="detail-food"></p>
        </div>
        <hr>
        <p class="detail-value" id="detail-contact"></p>
      </div>
    </div>
  </section>
</main>

<script>
/* =====================================================================
   👇 HIER EINFACH DEINE ANGABEN EINTRAGEN – DER REST LÄUFT AUTOMATISCH
   ===================================================================== */
const CONFIG = {
  name: "DEIN NAME",                       // z.B. "Lara"

  // Für die persönliche Version an deinen Freund: hier seinen Namen
  // eintragen -> wird oben als Gruss angezeigt. Sonst leer lassen ("").
  personalGreeting: "",                    // z.B. "Hey Leo, heute lernst du endlich alle kennen! 💙"

  when: "Samstag, 20. Oktober 2026 – ab 15:30 Uhr (Open End)",
  where: "DEINE ADRESSE HIER (Strasse, PLZ, Ort)",
  costume: "Bad Taste – zieh das Schrägste aus deinem Schrank an! Kein Stress, falls nichts perfekt sitzt – Hauptsache schräg und lustig 😄",
  teaser: "Spiele, ein Pizza-Abenteuer, Kuchen, gute Laune – der Rest ist Überraschung 🍕🎮",
  bring: "Gute Laune (Pflicht 😉) – und falls vorhanden: coole Gruppenspiele für ~10 Personen",
  food: "Für Essen ist gesorgt – ihr müsst nichts mitbringen",
  contact: "Fragen? Meld dich einfach bei mir!"
};
/* ===================================================================== */

// --- Screen 1 befüllen ---
document.getElementById("rsvp-title").textContent = CONFIG.name + " wird 18! 🎂";

// --- Screen 2 befüllen ---
document.getElementById("greeting").textContent =
  CONFIG.personalGreeting || ("Schön, dass du kommst, " + "!");
if(!CONFIG.personalGreeting){
  document.getElementById("greeting").style.display = "none";
}
document.getElementById("detail-when").textContent = CONFIG.when;
document.getElementById("detail-where").textContent = CONFIG.where;
document.getElementById("detail-costume").textContent = CONFIG.costume;
document.getElementById("detail-teaser").textContent = CONFIG.teaser;
document.getElementById("detail-bring").textContent = CONFIG.bring;
document.getElementById("detail-food").textContent = CONFIG.food;
document.getElementById("detail-contact").textContent = CONFIG.contact;

// --- Ja/Nein Logik ---
const btnYes = document.getElementById("btn-yes");
const btnNo = document.getElementById("btn-no");
const reaction = document.getElementById("reaction-text");
const screenRsvp = document.getElementById("screen-rsvp");
const screenDetails = document.getElementById("screen-details");

const yesTexts = [
  "Nice! 🎉",
  "Noch mehr Vorfreude? 😄",
  "Es wird nur noch cooler...",
  "Fast am Ziel!",
  "Los geht's! 🚀"
];
const noTexts = [
  "Bist du sicher?",
  "Wirklich wirklich sicher?",
  "Schade... 🥺",
  "Ich flieh schon mal weiter weg...",
  "Man wird mich kaum noch finden 🙈"
];

let yesClicks = 0;
let noClicks = 0;

btnYes.addEventListener("click", () => {
  yesClicks++;
  const scale = 1 + yesClicks * 0.35;
  btnYes.style.transform = `scale(${scale})`;
  reaction.textContent = yesTexts[Math.min(yesClicks - 1, yesTexts.length - 1)];
  if (yesClicks >= 5) {
    setTimeout(goToDetails, 400);
  }
});

btnNo.addEventListener("click", () => {
  noClicks++;
  const scale = Math.max(0.15, 1 - noClicks * 0.15);
  btnNo.classList.add("roaming");
  btnNo.style.transform = `scale(${scale})`;

  // an eine zufällige Stelle im sichtbaren Bereich "flüchten"
  const maxX = window.innerWidth - 120;
  const maxY = window.innerHeight - 60;
  btnNo.style.left = Math.max(10, Math.random() * maxX) + "px";
  btnNo.style.top = Math.max(10, Math.random() * maxY) + "px";

  reaction.textContent = noTexts[Math.min(noClicks - 1, noTexts.length - 1)];
});

function goToDetails(){
  screenRsvp.classList.remove("active");
  screenDetails.classList.add("active");
}
</script>

</body>
</html>
